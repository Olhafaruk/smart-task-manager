<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#1e1e1e; stroke:#888; stroke-width:1.5; rx:10; ry:10; }
    .title { fill:#fff; font-family:Segoe UI, sans-serif; font-size:15px; font-weight:bold; }
    .text { fill:#ccc; font-family:Segoe UI, sans-serif; font-size:13px; }
    .label { fill:#aaa; font-family:Segoe UI, sans-serif; font-size:12px; }
    .arrow { stroke:#aaa; stroke-width:1.8; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#aaa" />
    </marker>

    <!-- React Logo -->
    <g id="react-logo" transform="scale(0.08)">
      <circle cx="300" cy="300" r="50" fill="#61dafb"/>
      <g stroke="#61dafb" stroke-width="30" fill="none">
        <ellipse rx="150" ry="50" cx="300" cy="300" transform="rotate(0 300 300)"/>
        <ellipse rx="150" ry="50" cx="300" cy="300" transform="rotate(60 300 300)"/>
        <ellipse rx="150" ry="50" cx="300" cy="300" transform="rotate(120 300 300)"/>
      </g>
    </g>

    <!-- FastAPI Logo -->
    <g id="fastapi-logo" transform="scale(0.12)">
      <circle cx="200" cy="200" r="180" fill="#009688"/>
      <polygon points="200,80 320,320 80,320" fill="#fff"/>
    </g>

    <!-- RabbitMQ Logo -->
    <g id="rabbit-logo" transform="scale(0.12)">
      <rect x="50" y="50" width="300" height="300" fill="#ff6600"/>
      <rect x="90" y="90" width="60" height="120" fill="#fff"/>
      <rect x="190" y="90" width="60" height="120" fill="#fff"/>
      <circle cx="260" cy="260" r="40" fill="#fff"/>
    </g>

    <!-- PostgreSQL Logo -->
    <g id="pg-logo" transform="scale(0.12)">
      <path d="M200 50c-80 0-150 70-150 150s70 150 150 150 150-70 150-150-70-150-150-150z" fill="#336791"/>
      <path d="M200 100c-50 0-90 40-90 90s40 90 90 90 90-40 90-90-40-90-90-90z" fill="#fff"/>
    </g>

    <!-- Docker Logo -->
    <g id="docker-logo" transform="scale(0.12)">
      <rect x="50" y="200" width="300" height="120" fill="#2496ed"/>
      <rect x="90" y="160" width="60" height="60" fill="#2496ed"/>
      <rect x="170" y="160" width="60" height="60" fill="#2496ed"/>
      <rect x="250" y="160" width="60" height="60" fill="#2496ed"/>
    </g>
  </defs>

  <!-- FRONTEND -->
  <rect x="380" y="20" width="260" height="90" class="box"/>
  <use href="#react-logo" x="395" y="25"/>
  <text x="520" y="55" text-anchor="middle" class="title">Frontend</text>
  <text x="520" y="80" text-anchor="middle" class="text">React + Vite + TypeScript (Nginx)</text>

  <!-- BACKEND CONTAINER -->
  <rect x="80" y="140" width="840" height="360" class="box"/>
  <text x="500" y="170" text-anchor="middle" class="title">Backend Microservices</text>

  <!-- AUTH SERVICE -->
  <rect x="120" y="210" width="230" height="100" class="box"/>
  <use href="#fastapi-logo" x="130" y="215"/>
  <text x="240" y="245" class="title">Auth Service</text>
  <text x="240" y="270" class="text">FastAPI</text>

  <!-- AUTH DB -->
  <rect x="150" y="340" width="170" height="80" class="box"/>
  <use href="#pg-logo" x="160" y="345"/>
  <text x="235" y="380" class="title">auth_db</text>
  <text x="235" y="400" class="text">PostgreSQL</text>

  <!-- TASK SERVICE -->
  <rect x="390" y="210" width="230" height="100" class="box"/>
  <use href="#fastapi-logo" x="400" y="215"/>
  <text x="505" y="245" class="title">Task Service</text>
  <text x="505" y="270" class="text">FastAPI</text>

  <!-- TASK DB -->
  <rect x="420" y="340" width="170" height="80" class="box"/>
  <use href="#pg-logo" x="430" y="345"/>
  <text x="505" y="380" class="title">tasks_db</text>
  <text x="505" y="400" class="text">PostgreSQL</text>

  <!-- NOTIFICATION SERVICE -->
  <rect x="660" y="230" width="230" height="100" class="box"/>
  <use href="#rabbit-logo" x="670" y="235"/>
  <text x="775" y="265" class="title">Notification Service</text>
  <text x="775" y="290" class="text">Python Consumer + RabbitMQ</text>

  <!-- RABBITMQ -->
  <rect x="690" y="360" width="170" height="80" class="box"/>
  <use href="#rabbit-logo" x="700" y="365"/>
  <text x="775" y="400" class="title">RabbitMQ</text>
  <text x="775" y="420" class="text">tasks exchange</text>

  <!-- ARROWS -->
  <line x1="510" y1="110" x2="510" y2="200" class="arrow"/>
  <text x="520" y="160" class="label">REST API</text>

  <line x1="235" y1="310" x2="235" y2="340" class="arrow"/>
  <text x="245" y="325" class="label">SQL</text>

  <line x1="505" y1="310" x2="505" y2="340" class="arrow"/>
  <text x="515" y="325" class="label">SQL</text>

  <line x1="620" y1="260" x2="660" y2="260" class="arrow"/>
  <text x="630" y="250" class="label">events</text>

  <line x1="775" y1="360" x2="775" y2="330" class="arrow"/>
  <text x="785" y="345" class="label">consume</text>
</svg>
